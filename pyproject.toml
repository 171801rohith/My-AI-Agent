[project]
name = "my-ai-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "appopener>=1.7",
    "dotenv>=0.9.9",
    "edge-tts>=7.0.2",
    "faster-whisper>=1.2.1",
    "google-api-python-client>=2.183.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.2",
    "keyboard>=0.13.5",
    "llama-index>=0.12.52",
    "llama-index-core>=0.12.52.post1",
    "llama-index-llms-google-genai>=0.2.5",
    "llama-index-llms-ollama>=0.6.2",
    "numpy>=2.3.2",
    "openwakeword>=0.6",
    "pyaudio>=0.2.14",
    "pydub>=0.25.1",
    "pygame>=2.6.1",
    "pyttsx3>=2.99",
    "rich>=14.1.0",
    "scipy>=1.16.0",
    "sounddevice>=0.5.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
xfail_strict = true

[tool.uv]
# The app is Windows-only (os.startfile, AppOpener). Locking only for Windows also
# avoids openwakeword's Linux-only tflite-runtime, which has no Python 3.12 wheel.
environments = ["sys_platform == 'win32'"]
